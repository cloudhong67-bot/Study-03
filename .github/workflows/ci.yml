# CI: 모든 PR과 main push에서 품질 검사 → Docker 이미지·E2E 순으로 확인한다.
# 로컬에서 같은 검사를 돌리는 명령은 CLAUDE.md "Stack and commands" 참고.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치·PR에 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22" # Dockerfile(node:22-alpine)과 같은 메이저 버전
  NEXT_TELEMETRY_DISABLED: "1"
  CHECKPOINT_DISABLE: "1" # Prisma CLI 업데이트 확인 끄기

jobs:
  quality:
    name: Lint · Typecheck · Unit/Integration · Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trivia
          POSTGRES_PASSWORD: trivia
          POSTGRES_DB: trivia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trivia -d trivia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 통합 테스트는 이 URL의 DB 이름 뒤에 _test를 붙인 별도 DB를 만들어 쓴다 (vitest.config.mts, tests/global-setup.ts).
      DATABASE_URL: postgresql://trivia:trivia@127.0.0.1:5432/trivia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (postinstall runs prisma generate)
        run: npm ci

      - name: Lint (Next rules + react-hooks v7)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: Docker image · E2E (Playwright)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # E2E 전후 정리(tests/e2e/global-setup·teardown)가 compose DB(127.0.0.1:5433)에 접속하는 데 쓴다.
      DATABASE_URL: postgresql://trivia:trivia@127.0.0.1:5433/trivia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build image and start app + db
        # --wait: 두 서비스의 healthcheck가 healthy가 될 때까지 기다린다 (app은 마이그레이션·시드 후 기동).
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            playwright-report/
            test-results/
            compose-logs.txt
          retention-days: 7

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
